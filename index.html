<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ry’s Auto Shop</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif;}
body{background:linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('https://images.unsplash.com/photo-1493238792000-8113da705763?auto=format&fit=crop&w=1600&q=80'); background-size:cover; background-attachment:fixed; background-position:center; color:white;}
header{background:#000; padding:15px 40px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:1000;}
.logo{display:flex; align-items:center;}
.logo-box{width:40px; height:40px; background:#ff3c00; margin-right:10px; position:relative; border-radius:6px;}
.logo-box:before{content:""; position:absolute; width:20px; height:20px; border:3px solid white; border-radius:50%; top:8px; left:8px;}
.logo h1{font-size:22px; color:#ff3c00;}
nav a{color:white; text-decoration:none; margin-left:25px; font-weight:bold;}
nav a:hover{color:#ff3c00;}
.hero{height:90vh; display:flex; justify-content:center; align-items:center; text-align:center;}
.hero h2{font-size:50px;}
.hero p{margin:20px 0; font-size:18px;}
.btn{padding:12px 25px; background:#ff3c00; color:white; border:none; border-radius:5px; cursor:pointer;}
.btn:hover{background:#cc2f00;}
.booking{padding:60px 40px; background:#000;}
form{max-width:500px; margin:auto; display:flex; flex-direction:column;}
form input, form select{padding:10px; margin:10px 0; border-radius:5px; border:none;}
#receipt{display:none; max-width:500px; margin:20px auto; background:#111; padding:20px; border-radius:10px; box-shadow:0 0 10px #ff3c00;}
#receiptContent{color:white; line-height:1.6;}
</style>
</head>
<body>

<header>
<div class="logo">

<h1>Ry’s Auto Shop</h1>
</div>
<nav>
<a href="#home">Home</a>
<a href="#services">Services</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section class="hero" id="home">
<div>
<h2>Professional Automotive Services</h2>
<p>Quality repair and maintenance in Cebu City</p>
<a href="#booking"><button class="btn">Book Now</button></a>
</div>
</section>

<section class="booking" id="booking">

<input type="date" id="date" required>
<input type="time" id="time" required>
<select id="paymentType" required>

<option value="Cash">Cash</option>
<option value="Online">Online</option>
</select>
<select id="paymentMethod" style="display:none;" required>

<option value="Gcash">Gcash</option>
<option value="Bank Transfer">Bank Transfer</option>
</select>
<button type="submit" class="btn">Submit Booking</button>
</form>
</section>

<!-- Receipt -->
<div id="receipt">
<h3 style="color:#ff3c00; text-align:center; margin-bottom:15px;">Booking Receipt</h3>
<div id="receiptContent"></div>
<button onclick="window.print()" class="btn" style="margin-top:15px; width:100%;">Print / Save PDF</button>
</div>

<section class="section" id="contact">
<h2>Contact Us</h2>
<p>📍 128 San Roque Street, Hipodromo, Cebu City</p>
<p>📞 09682824032</p>
</section>
