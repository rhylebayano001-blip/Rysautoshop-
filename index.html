<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ry’s Auto Shop</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
scroll-behavior:smooth;
}

body{
background:linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
url('https://images.unsplash.com/photo-1493238792000-8113da705763?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-attachment:fixed;
background-position:center;
color:white;
}

header{
background:#000;
padding:15px 40px;
display:flex;
justify-content:center;
align-items:center;
}

header h1{color:#ff3c00;}

.booking{
padding:60px 40px;
background:#111;
}

form{
max-width:600px;
margin:auto;
display:flex;
flex-direction:column;
}

form input, form select{
padding:10px;
margin:8px 0;
border-radius:5px;
border:none;
}

.btn{
padding:12px;
background:#ff3c00;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

.btn:hover{background:#cc2f00;}

#priceDisplay{
margin-top:10px;
color:#00ffcc;
font-weight:bold;
}

/* RECEIPT MODAL */
#receiptModal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
z-index:2000;
}

.receipt-box{
background:#111;
padding:25px;
border-radius:10px;
width:420px;
box-shadow:0 0 15px #ff3c00;
}

.receipt-buttons{
margin-top:15px;
display:flex;
justify-content:space-between;
}

.exit-btn{background:#555;}
</style>
</head>

<body>

<header>
<h1>Ry’s Auto Shop</h1>
</header>

<section class="booking">
<h2 style="text-align:center;color:#ff3c00;">Book & Pay</h2>

<form id="bookingForm">

<input type="text" id="name" placeholder="Owner Full Name" required>
<input type="tel" id="mobile" placeholder="Mobile Number" required>

<input type="text" id="plate" placeholder="Car Plate Number" required>
<input type="text" id="brand" placeholder="Vehicle Brand (e.g. Toyota)" required>
<input type="text" id="model" placeholder="Vehicle Model (e.g. Vios)" required>

<select id="service" required>
<option value="">Select Service</option>
<option value="Engine Repair">Engine Repair</option>
<option value="Oil Change">Oil Change</option>
<option value="Brake Replacement">Brake Replacement</option>
<option value="Tire Replacement">Tire Replacement</option>
<option value="Car Tune-Up">Car Tune-Up</option>
</select>

<select id="carType" required>
<option value="">Select Car Type</option>
<option value="Sedan">Sedan</option>
<option value="SUV">SUV</option>
<option value="Pickup">Pickup</option>
<option value="Van">Van</option>
<option value="Truck">Truck</option>
</select>

<select id="paymentType" required>
<option value="">Select Payment Type</option>
<option value="Cash">Cash</option>
<option value="Online">Online</option>
</select>

<input type="date" id="date" required>
<input type="time" id="time" required>

<div id="priceDisplay"></div>

<button type="submit" class="btn">Confirm Booking</button>
</form>
</section>

<!-- RECEIPT -->
<div id="receiptModal">
<div class="receipt-box">
<h3 style="color:#ff3c00;text-align:center;">Official Receipt</h3>
<div id="receiptContent"></div>
<div class="receipt-buttons">
<button class="btn" onclick="window.print()">Print</button>
<button class="btn exit-btn" onclick="closeReceipt()">Exit</button>
</div>
</div>
</div>

<script>

// Prices per service per car type
const servicePrices={
"Engine Repair":{"Sedan":5000,"SUV":6000,"Pickup":6500,"Van":7000,"Truck":8000},
"Oil Change":{"Sedan":1500,"SUV":1800,"Pickup":2000,"Van":2200,"Truck":2500},
"Brake Replacement":{"Sedan":3000,"SUV":3500,"Pickup":4000,"Van":4500,"Truck":5000},
"Tire Replacement":{"Sedan":4000,"SUV":4500,"Pickup":5000,"Van":5500,"Truck":6000},
"Car Tune-Up":{"Sedan":2500,"SUV":3000,"Pickup":3500,"Van":4000,"Truck":4500}
};

// Estimated completion time
const serviceDuration={
"Engine Repair":"2-3 Days",
"Oil Change":"1-2 Hours",
"Brake Replacement":"3-4 Hours",
"Tire Replacement":"1-2 Hours",
"Car Tune-Up":"2-3 Hours"
};

const service=document.getElementById('service');
const carType=document.getElementById('carType');
const priceDisplay=document.getElementById('priceDisplay');

function updatePrice(){
if(service.value && carType.value){
let price=servicePrices[service.value][carType.value];
priceDisplay.innerHTML=`Total Price: ₱${price}`;
}else{
priceDisplay.innerHTML='';
}
}

service.addEventListener('change',updatePrice);
carType.addEventListener('change',updatePrice);

document.getElementById('bookingForm').addEventListener('submit',function(e){
e.preventDefault();

let name=name.value;
let mobile=document.getElementById('mobile').value;
let plate=document.getElementById('plate').value;
let brand=document.getElementById('brand').value;
let model=document.getElementById('model').value;
let serviceType=service.value;
let car=carType.value;
let payment=document.getElementById('paymentType').value;
let date=document.getElementById('date').value;
let time=document.getElementById('time').value;

let price=servicePrices[serviceType][car];
let duration=serviceDuration[serviceType];

// Automatic receipt number
let receiptNumber="RY-"+Date.now();

// Simulate online payment confirmation
if(payment==="Online"){
alert("Redirecting to Online Payment...");
alert("Payment Successful!");
}

let bookings=JSON.parse(localStorage.getItem('bookings'))||[];
bookings.push({
receiptNumber,
name,
mobile,
plate,
brand,
model,
service:serviceType,
carType:car,
price,
duration,
date,
time,
paymentType:payment,
done:false
});
localStorage.setItem('bookings',JSON.stringify(bookings));

document.getElementById('receiptContent').innerHTML=`
<p><strong>Receipt No:</strong> ${receiptNumber}</p>
<p><strong>Name:</strong> ${name}</p>
<p><strong>Mobile:</strong> ${mobile}</p>
<p><strong>Plate No:</strong> ${plate}</p>
<p><strong>Vehicle:</strong> ${brand} ${model}</p>
<p><strong>Service:</strong> ${serviceType}</p>
<p><strong>Car Type:</strong> ${car}</p>
<p><strong>Estimated Completion:</strong> ${duration}</p>
<p><strong>Total Paid:</strong> ₱${price}</p>
<p><strong>Payment Type:</strong> ${payment}</p>
<p><strong>Date:</strong> ${date} ${time}</p>
<p style="color:#ff3c00;text-align:center;margin-top:10px;">
Thank you for choosing Ry’s Auto Shop!
</p>
`;

document.getElementById('receiptModal').style.display="flex";
this.reset();
priceDisplay.innerHTML='';
});

function closeReceipt(){
document.getElementById('receiptModal').style.display="none";
}

</script>

</body>
</html>
